      variables:
        ENV: "nexcel-aws"
    - if: $CI_COMMIT_TAG == "nexcel-prod"'
      variables:
        ENV: "nexcel-prod"
    - if: $CI_COMMIT_TAG == "nexcel-all"'
      variables:
        ENV: "nexcel-all"

