workflow:
  rules:
###NEXCEL
    - if: $CI_COMMIT_TAG == "nexcel-local"'
      variables:
        ENV: "nexcel-local"
    - if: $CI_COMMIT_TAG == "nexcel-uat"'
      variables:
        ENV: "nexcel-uat"
    - if: $CI_COMMIT_TAG == "nexcel-sit"'
      variables:
        ENV: "nexcel-sit"
