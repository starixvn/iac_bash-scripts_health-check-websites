stages:
  - test

workflow:
  rules:
###NEXCEL
    - if: $CI_COMMIT_TAG == "nexcel-local"
      variables:
        ENV: "nexcel-local"
    - if: $CI_COMMIT_TAG == "nexcel-uat"
      variables:
        ENV: "nexcel-uat"
    - if: $CI_COMMIT_TAG == "nexcel-sit"
      variables:
        ENV: "nexcel-sit"
    - if: $CI_COMMIT_TAG == "nexcel-aws"
      variables:
        ENV: "nexcel-aws"
    - if: $CI_COMMIT_TAG == "nexcel-prod"
      variables:
        ENV: "nexcel-prod"
    - if: $CI_COMMIT_TAG == "nexcel-all"
      variables:
        ENV: "nexcel-all"

check-nexcel:
  stage: test
  script:
    - ls -l
    - echo $ENV;
    - sh test.sh "bbb"
    - sh test.sh "$ENV"
    - echo "done"
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG ;