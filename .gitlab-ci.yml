stages:
  - test

include: 'rules.gitlab-ci.yml'

check-domains:
  stage: test
  script:
    - echo $ENV;
    - sh test.sh "$ENV"
    - echo "done"
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG ;

check-domains-with-hosts:
  stage: test
  script:
    - echo "Testing with custom hosts file"
    - chmod +x test-with-hosts.sh
    - sudo ./test-with-hosts.sh
    - echo "done"
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG ;
  rules:
    - if: $CI_COMMIT_TAG =~ /test-with-hosts/