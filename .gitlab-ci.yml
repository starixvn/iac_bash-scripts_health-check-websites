stages:
  - test

include:
  - project: 'NEXOPS/haproxy/health-check-websites'
    file: 'rules.gitlab-ci.yml'

check-nexcel:
  stage: test
  script:
    - ls -l
    - echo $ENV;
    - sh test.sh "bbb"
    - sh test.sh "$ENV"
    - echo "done"
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG ;