stages:
  - test
  - cleanup

include: 'rules.gitlab-ci.yml'

check-domains:
  stage: test
  script:
    - |
      DOMAIN_FILE="domains/$ENV.txt"
      echo "Testing domain for $DOMAIN_FILE"

      echo "[*] Start Running Test"
      bash ./test.sh $DOMAIN_FILE
      
      echo "[*] Test Finish!"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /_prod-domains$/ || $CI_COMMIT_TAG =~ /_testing-domains$/
    - if: $CI_COMMIT_TAG =~ /nexcel/ || $CI_COMMIT_TAG =~ /lumi/ || $CI_COMMIT_TAG =~ /nexops/ || $CI_COMMIT_TAG =~ /alpha/

check-domains-with-hosts:
  stage: test
  script:
    - |
      DOMAIN_FILE="domains/${CI_COMMIT_TAG%_with-hosts}.txt"
      echo "Testing with custom hosts file for $DOMAIN_FILE"
      chmod +x update-hosts.sh test.sh

      echo "[*] Update Host file"
      bash ./update-hosts.sh $DOMAIN_FILE

      echo "[*] Start Running Test"
      bash ./test.sh $DOMAIN_FILE

      echo "[*] Test Finish!"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /_with-hosts$/

all-check-domains-with-hosts:
  stage: test
  script:
    - |
      echo "Test All Domain with Host file!"
      chmod +x update-hosts.sh test.sh

      find ./domains -type f -name "*_prod*.txt" | while IFS= read -r domain_file; do
        file_name=$(basename "$domain_file" .txt)
        export CI_COMMIT_TAG="${file_name}_with-hosts"
        export DOMAIN_FILE="domains/${file_name}.txt"

        echo "Running HealthCheck with Custom hosts file for $DOMAIN_FILE"
        echo "[🔧] Update Host file"
        bash ./update-hosts.sh $DOMAIN_FILE
        echo "[🚀] Start Running Test"
        bash ./test.sh $DOMAIN_FILE
        echo "[✅] Test Finish for $DOMAIN_FILE!"
      done

      echo "[🏁] Test ALL Finish!"
      
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /test-all-with-hosts/

all-check-domains:
  stage: test
  script:
    - |
      echo "Test All Domain!"
      chmod +x test.sh

      find ./domains -type f -name "*_prod*.txt" | while IFS= read -r domain_file; do
        file_name=$(basename "$domain_file" .txt)
        export CI_COMMIT_TAG="${file_name}"
        export DOMAIN_FILE="domains/${file_name}.txt"

        echo "Running HealthCheck for $DOMAIN_FILE"
        echo "[🚀] Start Running Test"
        bash ./test.sh $DOMAIN_FILE
        echo "[✅] Test Finish for $DOMAIN_FILE!"
      done

      echo "[🏁] Test ALL Finish!"
      
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /test-all/

check-domain-healthcheck-path:
  stage: test
  script:
    - |
      DOMAIN_FILE="domains/${CI_COMMIT_TAG%_healthpath}.txt"
      echo "Test Domain with Healthcheck path - with Host file!"
      chmod +x parser-healthcheck-path.sh test.sh

      echo "[*] Parser URL Healthcheck"
      bash ./parser-healthcheck-path.sh $DOMAIN_FILE

      echo "[*] Start Running Test"
      bash ./test.sh $DOMAIN_FILE

      echo "[*] Test Finish!"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /_healthpath$/

check-domain-healthcheck-path-with-hosts:
  stage: test
  script:
    - |
      DOMAIN_FILE="domains/${CI_COMMIT_TAG%_healthpath-with-hosts}.txt"
      echo "Test Domain Healthcheck path with hosts file!"
      chmod +x update-hosts.sh parser-healthcheck-path.sh test.sh

      pre_notify=":pepe-sprint: :pepe-sprint: Start Healthcheck for ALL Domains :pepe-sprint: :pepe-sprint:"
      curl -d "token=$SKYNEX_TOKEN&message=$pre_notify&conversationId=$REPORT_GROUP_ID" $SKYNEX_WEBHOOK

      echo "[*] Parser URL Healthcheck"
      bash ./parser-healthcheck-path.sh $DOMAIN_FILE

      echo "[*] Update Host file"
      bash ./update-hosts.sh $DOMAIN_FILE

      echo "[*] Start Running Test"
      bash ./test.sh $DOMAIN_FILE

      post_notify="🏁 Test Finish!"
      curl -d "token=$SKYNEX_TOKEN&message=$post_notify&conversationId=$REPORT_GROUP_ID" $SKYNEX_WEBHOOK

      echo "[*] Test Finish!"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /_healthpath-with-hosts$/

clean-tag:
  stage: cleanup
  needs:
    - job: check-domains
      optional: true
    - job: check-domains-with-hosts
      optional: true
    - job: all-check-domains-with-hosts
      optional: true
  script:
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true